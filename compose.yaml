name: semantic-mpc

x-runtime: &runtime
  build:
    context: .
    dockerfile: docker/Dockerfile
  init: true
  restart: "no"
  user: "${RUNTIME_UID:-1000}:${RUNTIME_GID:-1000}"
  ipc: private
  shm_size: 1gb
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  ports:
    - "127.0.0.1:${UNITY_TCP_PORT:-10000}:10000"
  environment:
    HOME: /runs/home
    ROS_HOME: /runs/ros
    ROS_LOG_DIR: /runs/ros/log
    WANDB_API_KEY: ${WANDB_API_KEY:-}
    YOLO_DEVICE: ${YOLO_DEVICE:-cuda}
    NMPC_DEVICE: ${NMPC_DEVICE:-cuda}
    NMPC_MODEL_DIR: /models/nmpc
    RL_POLICY_PATH: /models/rl/final_model.zip
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    OPENBLAS_NUM_THREADS: "1"
  volumes:
    - ./models:/models:ro
    - ./runs:/runs
    - ./src/semantic_mpc/semantic_mpc/config:/workspace/src/semantic_mpc/semantic_mpc/config:ro
  healthcheck:
    test: ["CMD-SHELL", "rosnode list 2>/dev/null | grep -q /unity_endpoint"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s
  stop_grace_period: 10s

services:
  dataset-generate:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [pipeline]
    init: true
    user: "${RUNTIME_UID:-1000}:${RUNTIME_GID:-1000}"
    environment:
      HOME: /runs/home
    volumes:
      - ./datasets:/data
      - ./models:/models:ro
      - ./mlp_pipeline/config.yaml:/config/pipeline.yaml:ro
    entrypoint: ["python3", "/workspace/mlp_pipeline/generate.py"]
    command: ["--config", "/config/pipeline.yaml"]

  model-train:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: [pipeline]
    init: true
    user: "${RUNTIME_UID:-1000}:${RUNTIME_GID:-1000}"
    environment:
      HOME: /runs/home
    volumes:
      - ./datasets:/data:ro
      - ./models:/models
      - ./runs:/runs
      - ./mlp_pipeline/config.yaml:/config/pipeline.yaml:ro
    entrypoint: ["bash", "-lc"]
    command: ["source /workspace/devel/setup.bash && python3 /workspace/mlp_pipeline/train.py --config /config/pipeline.yaml"]

  baseline:
    <<: *runtime
    profiles: [baseline]
    command: ["baseline"]

  rl:
    <<: *runtime
    profiles: [rl]
    command: ["rl"]

  nmpc:
    <<: *runtime
    profiles: [nmpc]
    command: ["nmpc"]
